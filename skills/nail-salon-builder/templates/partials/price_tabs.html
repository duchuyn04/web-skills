{% from "partials/macros.html" import service_row, price_notes_box with context %}
<div class="tabs" data-tabs>
  <div class="tab-list" role="tablist" aria-label="Nhóm dịch vụ">
    {% for c in cats %}<button type="button" role="tab" id="tab-{{ c.id }}" aria-controls="panel-{{ c.id }}" aria-selected="{{ 'true' if loop.first else 'false' }}" {% if not loop.first %}tabindex="-1"{% endif %}>{{ c.name }}</button>{% endfor %}
  </div>
  {% for c in cats %}
  <div class="tab-panel" role="tabpanel" id="panel-{{ c.id }}" aria-labelledby="tab-{{ c.id }}" {% if not loop.first %}hidden{% endif %}>
    <ul class="svc-list">{% for s in menu if s.category == c.id %}{{ service_row(root, s) }}{% endfor %}</ul>
  </div>
  {% endfor %}
</div>
{{ price_notes_box() }}
