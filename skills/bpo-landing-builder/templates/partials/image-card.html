<a class="bl-icard" href="{{href}}"{{^slider}} data-reveal{{/slider}} draggable="false">
        <span class="bl-frame bl-icard__media" data-wipe="up"><img src="{{photo.src}}" alt="{{photo.alt}}" width="480" height="320" loading="lazy" draggable="false"></span>
        <span class="bl-icard__body">
          {{#tag}}<span class="bl-icard__top"><span class="bl-chip bl-chip--accent">{{tag}}</span>{{#meta}}<span class="bl-icard__meta">{{meta}}</span>{{/meta}}</span>{{/tag}}
          {{^tag}}{{#meta}}<span class="bl-icard__top"><span class="bl-icard__meta">{{meta}}</span></span>{{/meta}}{{/tag}}
          <span class="bl-icard__title">{{title}}</span>
          {{#text}}<span class="bl-icard__text">{{text}}</span>{{/text}}
          <span class="bl-link bl-icard__more">{{link_label}}{{arrow}}</span>
        </span>
      </a>
