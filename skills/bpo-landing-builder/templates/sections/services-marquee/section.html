<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}} bl-services-marquee" data-smarq>
  <div class="bl-container">
    {{> head-split}}
  </div>
  <div class="bl-services-marquee__stage" data-reveal>
    <ul class="bl-services-marquee__list" data-smarq-list>
      {{#items}}<li class="bl-services-marquee__item"><a class="bl-services-marquee__link" href="{{href}}" data-smarq-i="{{@index}}">{{name}}</a></li>
      {{/items}}
    </ul>
    <span class="bl-services-marquee__card" aria-hidden="true" data-smarq-card>
      {{#items}}<img src="{{photo.src}}" alt="" width="360" height="270" loading="lazy" decoding="async" data-smarq-img="{{@index}}">{{/items}}
    </span>
  </div>
  {{#cta}}<div class="bl-container bl-services-marquee__foot" data-reveal><a class="bl-link" href="{{href}}">{{label}}{{arrow}}</a></div>{{/cta}}
</section>
