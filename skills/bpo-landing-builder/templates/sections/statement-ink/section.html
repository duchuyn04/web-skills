<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}} bl-statement-ink" data-ink-sec>
  <div class="bl-container bl-statement-ink__inner">
    {{#eyebrow}}<p class="bl-eyebrow" data-reveal>{{eyebrow}}</p>{{/eyebrow}}
    <p class="bl-statement-ink__text" data-ink>{{text}}</p>
    {{#attribution}}<p class="bl-statement-ink__by" data-reveal><span class="bl-statement-ink__rule" aria-hidden="true"></span>{{attribution}}</p>{{/attribution}}
    {{#link}}<a class="bl-link" href="{{href}}" data-reveal>{{label}}{{arrow}}</a>{{/link}}
  </div>
</section>
