<header id="{{section.id}}" class="bl-header bl-header--simple {{#nav_long}}bl-header--long {{/nav_long}}bl-tone-{{section.tone}}" data-bl-header>
  <div class="bl-container bl-header__bar">
    <a class="bl-brand" href="{{page.home}}" aria-label="{{site.brand}} home">{{> brand}}</a>
    <nav class="bl-nav" aria-label="Main">
      <ul class="bl-nav__list">
        {{#links}}<li class="bl-nav__item"><a class="bl-nav__link" href="{{href}}">{{label}}</a></li>{{/links}}
      </ul>
    </nav>
    <div class="bl-header__actions">
      {{#secondary}}<a class="bl-header__secondary" href="{{href}}">{{label}}</a>{{/secondary}}
      <a class="bl-btn bl-btn--primary bl-btn--sm" href="{{cta.href}}"{{#features.magnetic_cta}} data-magnetic{{/features.magnetic_cta}}>{{cta.label}}</a>
      <button class="bl-burger" type="button" data-nav-toggle aria-expanded="false" aria-controls="bl-drawer">{{icon:menu}}<span class="bl-sr-only">{{menu_label}}</span></button>
    </div>
  </div>
  <div class="bl-drawer bl-tone-{{section.tone}}" id="bl-drawer" data-nav-drawer>
    <div class="bl-drawer__head">
      <a class="bl-brand" href="{{page.home}}" aria-label="{{site.brand}} home">{{> brand}}</a>
      <button class="bl-drawer__close" type="button" data-nav-close>{{icon:x}}<span class="bl-sr-only">{{close_label}}</span></button>
    </div>
    <ul class="bl-drawer__nav">
      {{#links}}<li><a href="{{href}}">{{label}}</a></li>{{/links}}
      {{#secondary}}<li><a href="{{href}}">{{label}}</a></li>{{/secondary}}
    </ul>
    <div class="bl-drawer__foot">
      <a class="bl-btn bl-btn--primary bl-btn--block" href="{{cta.href}}">{{cta.label}}</a>
    </div>
  </div>
</header>
