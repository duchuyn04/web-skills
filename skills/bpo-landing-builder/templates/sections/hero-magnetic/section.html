<section id="{{section.id}}" class="bl-section bl-hero bl-h3d bl-hmag bl-h3d--{{align}} bl-tone-{{section.tone}}" data-gl="dots" data-fx="3d" data-seed="{{site.brand}}">
  <div class="bl-hmag__bg" aria-hidden="true"><canvas class="bl-h3d__canvas" data-gl-canvas></canvas></div>
  <div class="bl-container bl-hmag__inner">
    <div class="bl-h3d__copy bl-hmag__copy" data-reveal-group data-gl-copy>
      {{#eyebrow}}<p class="bl-eyebrow" data-reveal>{{eyebrow}}</p>{{/eyebrow}}
      <h1 class="bl-h1" data-reveal>{{title}}</h1>
      <p class="bl-lead bl-hero__lead" data-reveal>{{lead}}</p>
      <div class="bl-btn-row" data-reveal>
        <a class="bl-btn bl-btn--primary bl-btn--lg" href="{{primary_cta.href}}">{{primary_cta.label}}</a>
        {{#secondary_cta}}<a class="bl-btn bl-btn--ghost bl-btn--lg" href="{{href}}">{{label}}</a>{{/secondary_cta}}
      </div>
      {{#proof.0}}<ul class="bl-hero__proof" data-reveal>{{#proof}}<li>{{icon:check-circle}}<span>{{.}}</span></li>{{/proof}}</ul>{{/proof.0}}
    </div>
    <div class="bl-hmag__foot">
      {{#stats.0}}<dl class="bl-h3d__stats bl-hmag__stats" data-reveal data-gl-copy>{{#stats}}<div><dt>{{label}}</dt><dd>{{value}}</dd></div>{{/stats}}</dl>{{/stats.0}}
      <button class="bl-h3d__toggle bl-hmag__toggle" type="button" data-motion-toggle aria-pressed="false" data-label-pause="{{pause_label}}" data-label-play="{{play_label}}"><span class="bl-motion-toggle__pause">{{icon:pause}}</span><span class="bl-motion-toggle__play">{{icon:play}}</span><span data-motion-label>{{pause_label}}</span></button>
    </div>
  </div>
</section>
