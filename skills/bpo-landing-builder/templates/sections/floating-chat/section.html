<aside id="{{section.id}}" class="bl-fab bl-tone-light" data-fab aria-label="{{label}}">
  <a class="bl-fab__link" href="{{href}}">
    <span class="bl-fab__bubble"><strong>{{label}}</strong>{{#status}}<small>{{status}}</small>{{/status}}</span>
    <span class="bl-fab__btn">{{icon:$icon}}<span class="bl-fab__ping" aria-hidden="true"></span></span>
  </a>
</aside>
