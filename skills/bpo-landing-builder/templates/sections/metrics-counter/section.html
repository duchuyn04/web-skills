<section id="{{section.id}}" class="bl-section bl-metrics{{#visual}} bl-has-backdrop{{/visual}}{{^visual}}{{#image}} bl-metrics--photo{{/image}}{{/visual}} bl-tone-{{section.tone}}"{{#visual}} data-fx="3d" data-seed="{{site.brand}}" data-gl="{{visual}}"{{/visual}}>
  {{#visual}}<div class="bl-backdrop" aria-hidden="true"><canvas data-gl-canvas></canvas></div>{{/visual}}
  {{^visual}}{{#image}}<div class="bl-metrics__media" aria-hidden="true" data-metrics-photo><img src="{{image}}" alt="" width="1600" height="900" loading="lazy" decoding="async"><span class="bl-metrics__scrim"></span></div>{{/image}}{{/visual}}
  <div class="bl-container">
    <div class="bl-metrics__head" data-reveal data-gl-copy>
      <div>
        {{#eyebrow}}<p class="bl-eyebrow">{{eyebrow}}</p>{{/eyebrow}}
        <h2 class="bl-h2">{{title}}</h2>
      </div>
      {{#lead}}<p class="bl-lead">{{lead}}</p>{{/lead}}
    </div>
    <dl class="bl-metrics__grid" data-reveal-group>
      {{#items}}
      <div class="bl-metric" data-reveal data-gl-copy>
        <dt class="bl-metric__label">{{label}}</dt>
        <dd class="bl-metric__value"><span{{#value.count}} data-count="{{value.count}}" data-decimals="{{value.decimals}}" data-prefix="{{value.prefix}}" data-suffix="{{value.suffix}}"{{/value.count}}>{{value.display}}</span></dd>
        {{#note}}<dd class="bl-metric__note">{{note}}</dd>{{/note}}
      </div>
      {{/items}}
    </dl>
  </div>
</section>
