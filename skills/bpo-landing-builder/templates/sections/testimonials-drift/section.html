<section id="{{section.id}}" class="bl-section bl-drift bl-tone-{{section.tone}}" data-drift>
  <div class="bl-container">
    <div class="bl-drift__top">
      {{> head}}
      <button class="bl-drift__toggle" type="button" data-drift-toggle aria-pressed="false" data-label-pause="{{pause_label}}" data-label-play="{{play_label}}"><span class="bl-drift__i-pause">{{icon:pause}}</span><span class="bl-drift__i-play">{{icon:play}}</span><span data-drift-label>{{pause_label}}</span></button>
    </div>
    <ul class="bl-drift__list" data-drift-list>
      {{#items}}
      <li class="bl-drift__card">
        <p class="bl-drift__quote">{{quote}}</p>
        <p class="bl-drift__who">
          {{#avatar}}<img class="bl-drift__avatar" src="{{avatar}}" alt="" width="40" height="40" loading="lazy">{{/avatar}}{{^avatar}}<span class="bl-drift__avatar bl-drift__initials" aria-hidden="true">{{initials}}</span>{{/avatar}}
          <span><strong>{{name}}</strong><small>{{role}}, {{company}}</small></span>
        </p>
      </li>
      {{/items}}
    </ul>
  </div>
</section>
