<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}}">
  <div class="bl-container bl-tools">
    <div class="bl-tools__copy">
      {{> head}}
      {{#link}}<p data-reveal><a class="bl-link" href="{{href}}">{{label}}{{arrow}}</a></p>{{/link}}
    </div>
    <ul class="bl-tools__grid" data-reveal-group>
      {{#tools}}
      <li class="bl-tool" data-reveal="pop">
        {{#logo}}<span class="bl-tool__mark bl-tool__mark--logo"><img src="{{logo}}" alt="" width="28" height="28" loading="lazy"></span>{{/logo}}
        {{^logo}}<span class="bl-tool__mark" aria-hidden="true">{{initial}}</span>{{/logo}}
        <span class="bl-tool__text"><strong>{{name}}</strong>{{#category}}<span>{{category}}</span>{{/category}}</span>
      </li>
      {{/tools}}
    </ul>
  </div>
</section>
