<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}}{{#slider}} bl-icards-sec--slider{{/slider}}"{{#slider}} data-slider{{/slider}}>
  <div class="bl-container">
    {{#head}}
    <div class="bl-head bl-head--split" data-reveal>
      <div>
        {{#eyebrow}}<p class="bl-eyebrow">{{eyebrow}}</p>{{/eyebrow}}
        <h2 class="bl-h2">{{title}}</h2>
      </div>
      <div class="bl-head__aside">
        {{#lead}}<p class="bl-lead">{{lead}}</p>{{/lead}}
        <div class="bl-icards__tools">
          {{#view_all}}<a class="bl-link" href="{{href}}">{{label}}{{arrow}}</a>{{/view_all}}
          {{#slider}}<div class="bl-slider-nav"><button class="bl-round-btn" type="button" data-slider-prev>{{icon:chevron-left}}<span class="bl-sr-only">{{prev_label}}</span></button><button class="bl-round-btn" type="button" data-slider-next>{{icon:chevron-right}}<span class="bl-sr-only">{{next_label}}</span></button></div>{{/slider}}
        </div>
      </div>
    </div>
    {{/head}}
    {{^slider}}
    <div class="bl-icards bl-icards--{{ratio}}" data-reveal-group>
      {{#cards}}{{> image-card}}{{/cards}}
    </div>
    {{/slider}}
  </div>
  {{#slider}}
  <div class="bl-slider-track bl-icards bl-icards--{{ratio}} bl-icards--slider" data-slider-track tabindex="0" aria-label="{{head.title_plain}}">
    {{#cards}}{{> image-card}}{{/cards}}
  </div>
  {{/slider}}
</section>
