<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}} bl-industries-rows" data-irows>
  <div class="bl-container bl-industries-rows__grid">
    <div class="bl-industries-rows__side">
      {{> head}}
      <a class="bl-btn bl-btn--primary" href="{{cta.href}}" data-reveal>{{cta.label}}</a>
    </div>
    <div class="bl-industries-rows__wrap">
      <ul class="bl-industries-rows__list" data-reveal-group>
        {{#items}}
        <li class="bl-industries-rows__item" data-reveal>
          <a class="bl-industries-rows__row" href="{{#href}}{{href}}{{/href}}{{^href}}{{cta.href}}{{/href}}" data-irow>
            <span class="bl-industries-rows__fill" aria-hidden="true"></span>
            <span class="bl-industries-rows__icon" aria-hidden="true">{{icon:$icon}}</span>
            <span class="bl-industries-rows__body">
              <span class="bl-industries-rows__title">{{title}}</span>
              <span class="bl-industries-rows__text">{{text}}</span>
            </span>
            <span class="bl-industries-rows__go" aria-hidden="true">{{arrow}}</span>
          </a>
        </li>
        {{/items}}
      </ul>
      <div class="bl-industries-rows__card" aria-hidden="true" data-icard>
        <span class="bl-industries-rows__card-icon" data-icard-icon></span>
        <strong class="bl-industries-rows__card-title" data-icard-title></strong>
        <span class="bl-industries-rows__card-text" data-icard-text></span>
        <span class="bl-industries-rows__card-cta">{{link_label}}</span>
      </div>
    </div>
  </div>
</section>
