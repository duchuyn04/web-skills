<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}}">
  <div class="bl-container">
    {{> head-center}}
    <div class="bl-tiles" data-reveal-group>
      {{#tiles}}
      <article class="bl-tile" data-tilt data-reveal>
        <span class="bl-icon-box">{{icon:$icon}}</span>
        <h3 class="bl-h3">{{title}}</h3>
        <p>{{text}}</p>
      </article>
      {{/tiles}}
    </div>
  </div>
</section>
