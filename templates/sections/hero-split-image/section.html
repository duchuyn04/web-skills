<section id="{{section.id}}" class="bl-section bl-hero bl-hero--split bl-tone-{{section.tone}}">
  <div class="bl-hero__bg" aria-hidden="true"><span class="bl-glow bl-glow--a"></span><span class="bl-glow bl-glow--b"></span><span class="bl-hero__grid"></span></div>
  <div class="bl-container bl-hero-split">
    <div class="bl-hero-split__copy" data-reveal-group>
      {{#eyebrow}}<p class="bl-eyebrow" data-reveal>{{eyebrow}}</p>{{/eyebrow}}
      <h1 class="bl-h1" data-reveal>{{title}}</h1>
      <p class="bl-lead bl-hero__lead" data-reveal>{{lead}}</p>
      <div class="bl-btn-row" data-reveal>
        <a class="bl-btn bl-btn--primary bl-btn--lg bl-btn--shimmer" href="{{primary_cta.href}}">{{primary_cta.label}}{{arrow}}</a>
        {{#secondary_cta}}<a class="bl-btn bl-btn--ghost bl-btn--lg" href="{{href}}">{{label}}</a>{{/secondary_cta}}
      </div>
      {{#proof.0}}<ul class="bl-hero__proof" data-reveal>{{#proof}}<li>{{icon:check-circle}}<span>{{.}}</span></li>{{/proof}}</ul>{{/proof.0}}
    </div>
    <div class="bl-hero-split__visual" data-reveal="fade">
      <div class="bl-frame bl-hero-split__frame"><img src="{{photo.src}}" alt="{{photo.alt}}" width="720" height="800" fetchpriority="high"></div>
      {{#badges}}<div class="bl-glass bl-float-badge bl-float-badge--{{@n}}"><span class="bl-icon-box">{{icon:$icon}}</span><span><strong>{{value}}</strong><small>{{label}}</small></span></div>{{/badges}}
    </div>
  </div>
</section>
