<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}}">
  <div class="bl-container">
    {{> head-split}}
    <div class="bl-bento" data-reveal-group>
      {{#cards}}
      <article class="bl-bento__card{{#@first}}{{#photo}} bl-bento__card--photo{{/photo}}{{/@first}}" data-reveal>
        {{#@first}}{{#photo}}<div class="bl-frame bl-bento__photo"><img src="{{src}}" alt="{{alt}}" width="960" height="560" loading="lazy" decoding="async"></div>{{/photo}}{{/@first}}
        <span class="bl-icon-box">{{icon:$icon}}</span>
        <h3 class="bl-h3">{{title}}</h3>
        <p>{{text}}</p>
        {{#bullets.0}}<ul class="bl-checks">{{#bullets}}<li>{{icon:check}}<span>{{.}}</span></li>{{/bullets}}</ul>{{/bullets.0}}
        {{#link}}<a class="bl-link" href="{{href}}">{{label}}{{arrow}}</a>{{/link}}
      </article>
      {{/cards}}
    </div>
  </div>
</section>
