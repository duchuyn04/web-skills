<section id="{{section.id}}" class="bl-section bl-trated bl-tone-{{section.tone}}" data-slider>
  <div class="bl-container bl-trated__layout">
    <div class="bl-trated__aside" data-reveal>
      {{#head}}
      {{#eyebrow}}<p class="bl-eyebrow">{{eyebrow}}</p>{{/eyebrow}}
      <h2 class="bl-h2">{{title}}</h2>
      {{#lead}}<p class="bl-lead">{{lead}}</p>{{/lead}}
      {{/head}}
      {{#rating}}
      <div class="bl-trated__score">
        <strong>{{score}}</strong>
        <span class="bl-trated__stars" aria-hidden="true" data-seq>{{icon:star}}{{icon:star}}{{icon:star}}{{icon:star}}{{icon:star}}</span>
        <small>{{label}}</small>
      </div>
      {{/rating}}
      <div class="bl-slider-nav bl-trated__nav">
        <button class="bl-round-btn" type="button" data-slider-prev>{{icon:chevron-left}}<span class="bl-sr-only">{{prev_label}}</span></button>
        <button class="bl-round-btn" type="button" data-slider-next>{{icon:chevron-right}}<span class="bl-sr-only">{{next_label}}</span></button>
      </div>
    </div>
    <div class="bl-trated__viewport">
      <div class="bl-trated__track" data-slider-track tabindex="0" aria-label="{{head.title_plain}}">
        {{#items}}
        <figure class="bl-trated__card" data-reveal>
          <p class="bl-trated__stars" data-rating="{{stars}}"><span class="bl-sr-only">{{rating_label}}: {{stars}}/5</span><span aria-hidden="true" data-seq>{{icon:star}}{{icon:star}}{{icon:star}}{{icon:star}}{{icon:star}}</span></p>
          <blockquote class="bl-trated__quote"><p>{{quote}}</p></blockquote>
          <figcaption class="bl-trated__who">
            {{#avatar}}<img class="bl-trated__avatar" src="{{avatar}}" alt="" width="56" height="56" loading="lazy" draggable="false">{{/avatar}}{{^avatar}}<span class="bl-trated__avatar bl-trated__initials" aria-hidden="true">{{initials}}</span>{{/avatar}}
            <span><strong>{{name}}</strong><small>{{role}}</small><small class="bl-trated__company">{{company}}</small></span>
          </figcaption>
        </figure>
        {{/items}}
      </div>
    </div>
  </div>
</section>
