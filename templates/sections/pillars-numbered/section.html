<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}}">
  <div class="bl-container">
    {{> head-split}}
    <div class="bl-grid bl-grid-3" data-reveal-group>
      {{#items}}
      <article class="bl-pillar" data-reveal>
        <span class="bl-pillar__rule" data-draw aria-hidden="true"></span>
        <h3 class="bl-h3">{{title}}</h3>
        <p>{{text}}</p>
      </article>
      {{/items}}
    </div>
  </div>
</section>
