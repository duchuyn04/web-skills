<section id="{{section.id}}" class="bl-section bl-qspot-sec bl-tone-{{section.tone}}">
  <div class="bl-qspot__bg" aria-hidden="true"><span class="bl-glow bl-glow--a"></span></div>
  <div class="bl-container bl-qspot" data-qspot data-reveal>
    <span class="bl-qspot__mark" aria-hidden="true">{{icon:quote}}</span>
    {{#eyebrow}}<p class="bl-eyebrow">{{eyebrow}}</p>{{/eyebrow}}
    <div class="bl-qspot__stage">
      {{#quotes}}
      <figure class="bl-qspot__item{{#@first}} is-active{{/@first}}" data-qspot-item{{^@first}} aria-hidden="true"{{/@first}}>
        <blockquote><p>{{quote}}</p></blockquote>
        <figcaption class="bl-qspot__who">
          {{#avatar}}<img class="bl-qspot__avatar" src="{{avatar}}" alt="" width="56" height="56" loading="lazy">{{/avatar}}{{^avatar}}<span class="bl-qspot__avatar bl-qspot__initials" aria-hidden="true">{{initials}}</span>{{/avatar}}
          <span class="bl-qspot__person"><strong>{{name}}</strong><small>{{role}}, {{company}}</small></span>
          {{#logo}}<img class="bl-qspot__logo" src="{{logo}}" alt="{{company}}" height="32" width="120" loading="lazy">{{/logo}}
        </figcaption>
      </figure>
      {{/quotes}}
    </div>
    {{#quotes.1}}
    <div class="bl-qspot__nav">
      <button class="bl-qspot__btn" type="button" data-qspot-prev>{{icon:chevron-left}}<span class="bl-sr-only">{{prev_label}}</span></button>
      <div class="bl-qspot__dots" aria-hidden="true">{{#quotes}}<span class="bl-qspot__dot{{#@first}} is-active{{/@first}}"></span>{{/quotes}}</div>
      <button class="bl-qspot__btn" type="button" data-qspot-next>{{icon:chevron-right}}<span class="bl-sr-only">{{next_label}}</span></button>
    </div>
    {{/quotes.1}}
  </div>
</section>
