<section id="{{section.id}}" class="bl-section bl-section--tight bl-tone-{{section.tone}}">
  <div class="bl-container">
    <div class="bl-mpanel bl-tone-dark" data-reveal>
      <span class="bl-glow bl-glow--a" aria-hidden="true"></span>
      <div class="bl-mpanel__copy">
        {{#eyebrow}}<p class="bl-eyebrow">{{eyebrow}}</p>{{/eyebrow}}
        <h2 class="bl-h2">{{title}}</h2>
        {{#text}}<p class="bl-mpanel__text">{{text}}</p>{{/text}}
      </div>
      <dl class="bl-mpanel__grid">
        {{#items}}
        <div class="bl-mpanel__stat">
          <dt>{{label}}</dt>
          <dd><span{{#value.count}} data-count="{{value.count}}" data-decimals="{{value.decimals}}" data-prefix="{{value.prefix}}" data-suffix="{{value.suffix}}"{{/value.count}}>{{value.display}}</span></dd>
        </div>
        {{/items}}
      </dl>
    </div>
  </div>
</section>
