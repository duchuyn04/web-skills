<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}}">
  <div class="bl-container bl-sgroups">
    {{#groups}}
    <div class="bl-sgroup">
      <div class="bl-head bl-sgroup__head" data-reveal>
        {{#eyebrow}}<p class="bl-eyebrow">{{eyebrow}}</p>{{/eyebrow}}
        <h2 class="bl-h2">{{title}}</h2>
        {{#text}}<p class="bl-lead">{{text}}</p>{{/text}}
      </div>
      <ul class="bl-slinks" data-reveal-group>
        {{#links}}<li data-reveal><a class="bl-slink" href="{{href}}">{{#icon}}<span class="bl-slink__icon">{{icon:$icon}}</span>{{/icon}}<span class="bl-slink__label">{{label}}</span>{{arrow}}</a></li>{{/links}}
      </ul>
    </div>
    {{/groups}}
  </div>
</section>
