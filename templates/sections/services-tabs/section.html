<section id="{{section.id}}" class="bl-section bl-tone-{{section.tone}}">
  <div class="bl-container">
    {{> head-center}}
    <div class="bl-tabs" data-tabs>
      <div class="bl-tabs__scroll" data-reveal>
        <div class="bl-tabs__list" role="tablist" aria-label="{{head.title_plain}}">
          <span class="bl-tabs__pill" aria-hidden="true"></span>
          {{#tabs}}<button class="bl-tabs__tab" type="button" role="tab" id="{{section.id}}-tab-{{@n}}" aria-controls="{{section.id}}-panel-{{@n}}" aria-selected="{{#@first}}true{{/@first}}{{^@first}}false{{/@first}}"{{^@first}} tabindex="-1"{{/@first}}>{{icon:$icon}}<span>{{tab}}</span></button>{{/tabs}}
        </div>
      </div>
      {{#tabs}}
      <div class="bl-tabs__panel" role="tabpanel" id="{{section.id}}-panel-{{@n}}" aria-labelledby="{{section.id}}-tab-{{@n}}"{{^@first}} hidden{{/@first}}>
        <div class="bl-tabs__copy">
          <h3 class="bl-tabs__title">{{title}}</h3>
          <p class="bl-lead">{{text}}</p>
          <ul class="bl-checks">{{#bullets}}<li>{{icon:check}}<span>{{.}}</span></li>{{/bullets}}</ul>
          {{#link}}<a class="bl-link" href="{{href}}">{{label}}{{arrow}}</a>{{/link}}
        </div>
        <div class="bl-frame bl-tabs__media"><img src="{{photo.src}}" alt="{{photo.alt}}" width="640" height="480" loading="lazy"></div>
      </div>
      {{/tabs}}
    </div>
  </div>
</section>
